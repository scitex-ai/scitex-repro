name: docs

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  sphinx:
    # A reviewed bundle PR uses the same message as the former bot commit.
    # Keep the existing loop guard without suppressing the required CI jobs.
    if: "!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + docs deps
        run: pip install -e ".[docs]"

      - name: Build Sphinx HTML (warnings fail PRs only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html
          else
            sphinx-build -b html docs/sphinx docs/sphinx/_build/html
          fi

      - name: Stage bounded HTML and source manifest for a reviewed PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          python -I .github/ci/stage-docs-bundle.py --source-sha "${{ github.sha }}"

      - name: Upload bundle for content review and ordinary feature-branch PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-bundle-${{ github.sha }}
          path: docs-bundle-artifact/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
