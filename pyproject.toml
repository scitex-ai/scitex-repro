[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-repro"
version = "0.1.8"
description = "Reproducibility utilities (random state, timestamps, hashing)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "reproducibility",
    "random-state",
    "hashing",
    "timestamps",
    "scientific",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scitex-logging>=0.2.2",
]

[project.optional-dependencies]
jax = [
    "jax",
    "jaxlib",
]
tensorflow = [
    "tensorflow",
]
torch = [
    "torch",
]
dev = [
    "jax",
    "jaxlib",
    "pytest",
    "pytest-cov",
    "ruff",
    "scitex-dev>=0.62.2",
    "tensorflow",
    "torch",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-repro[jax]",
    "scitex-repro[dev]",
    "scitex-repro[docs]",
    "scitex-repro[tensorflow]",
    "scitex-repro[torch]",
]

[project.entry-points."scitex_dev.docs"]
scitex-repro = "scitex_repro"

[project.entry-points."scitex_dev.skills"]
scitex-repro = "scitex_repro"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-repro"
Repository = "https://github.com/ywatanabe1989/scitex-repro.git"
Issues = "https://github.com/ywatanabe1989/scitex-repro/issues"
Documentation = "https://scitex-repro.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "smoke: fast CLI happy-path tests (<60s, runs on every PR)",
    "e2e: end-to-end workflows against real subsystems (runs on every PR)",
]

[tool.coverage.run]
parallel = true
source = ["scitex_repro"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

dependencies = [
    "scitex-dev>=0.62.2",
]
